name: cognizant-local

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [local]
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: api
    environment:
      NODE_ENV: production
      APP_ENV: local
      PORT: "4178"
      ENGINEER_PROVIDER_ENABLED: ${ENGINEER_PROVIDER_ENABLED:-false}
      ENGINEER_PROVIDER_URL: ${ENGINEER_PROVIDER_URL:-}
      ENGINEER_PROVIDER_API_KEY: ${ENGINEER_PROVIDER_API_KEY:-}
      LOG_DIRECTORY: /var/log/cognizant
    volumes:
      - service-logs:/var/log/cognizant
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4178/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s
    networks: [local]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=850MB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [local]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [local]
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.6.1
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - service-logs:/var/log/cognizant:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      api:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/12345 &&
          printf 'GET /-/healthy HTTP/1.0\r\n\r\n' >&3 &&
          IFS=' ' read -r protocol status rest <&3 &&
          [ "$$status" = "200" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [local]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Run npm run setup:local first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [local]
    restart: unless-stopped

networks:
  local:
    driver: bridge

volumes:
  grafana-data:
  loki-data:
  prometheus-data:
  service-logs:
  alloy-data:
