global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: [api:4178]
        labels:
          environment: local
          service: api
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
