name: make-a-mark-current-tailnet

services:
  web:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-8082}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      target: api
    environment:
      NODE_ENV: production
      APP_ENV: local
      PORT: "4178"
      KIRA_API_KEY: ${KIRA_API_KEY:-}
      KIRA_MODEL: ${KIRA_MODEL:-gpt-oss-120b}
      PILOT_DATA_FILE: /var/lib/make-a-mark/pilot-demo.json
      IMPACT_TOTALS_FILE: /var/lib/make-a-mark/impact-totals.json
    volumes:
      - pilot-data:/var/lib/make-a-mark
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4178/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pilot-data:
